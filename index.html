<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4C6EF5">
  <meta name="description" content="随手账 — 简单的个人记账工具">
  <title>随手账</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="随手账">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- 页面内容由 router 渲染 -->
    <main id="page" class="page"></main>

    <!-- 底部导航：首页 / 统计 / (+) / 账户 / 我的 -->
    <nav id="tabbar">
      <button class="tab" data-route="home" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-route="stats" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>统计</span>
      </button>
      <button class="tab-fab" id="fab-add" type="button" aria-label="记一笔">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-route="accounts" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v0H5a2 2 0 0 0-2 2z"/><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M16 13h2"/></svg>
        <span>账户</span>
      </button>
      <button class="tab" data-route="mine" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        <span>我的</span>
      </button>
    </nav>

    <!-- 弹层与提示容器 -->
    <div id="sheet-root"></div>
    <div id="toast-root"></div>
  </div>

  <!-- 脚本按依赖顺序加载，全局命名空间 SSZ（不用 ES Modules，保证 file:// 直开可用） -->
  <script src="libs/chart.umd.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/tx.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/pages-home.js"></script>
  <script src="js/pages-txlist.js"></script>
  <script src="js/pages-stats.js"></script>
  <script src="js/pages-accounts.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/recurring.js"></script>
  <script src="js/pages-categories.js"></script>
  <script src="js/pages-mine.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/pages-about.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
